<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Structure</title>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>My Website</h1>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#features">Features</a></li>
        <li><a href="#gallery">Gallery</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>

    <!-- About Section -->
    <section id="about">
      <h2>About</h2>
      <p>This is a short paragraph about the website.</p>
    </section>

    <!-- Features Section -->
    <section id="features">
      <h2>Features</h2>
      <ul>
        <li>Fast and reliable</li>
        <li>User-friendly design</li>
        <li>Responsive layout</li>
      </ul>
      <ol>
        <li>Step one</li>
        <li>Step two</li>
        <li>Step three</li>
      </ol>
    </section>

    <!-- Gallery Section -->
    <section id="gallery">
      <h2>Gallery</h2>
      <img src="gallery_placeholder.jpg" alt="Gallery placeholder image">
    </section>

  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 My Website | <a href="#top">Back to top</a></p>
  </footer>

</body>
</html>
